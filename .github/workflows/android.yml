name: APK derle ve yayınla

# v1.0.0 gibi bir etiket (tag) push edildiğinde çalışır.
# Elle tetiklemek için Actions sekmesinden "Run workflow" da denebilir.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # Release oluşturup APK'yı eklemek için gerekli

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Web tarafını derle (Next.js statik export)
        run: npm run build

      - name: Capacitor senkronizasyonu
        run: npx cap sync android

      # gradlew depoda çalıştırılabilir olarak işaretli değil (mod 100644)
      - name: gradlew'e çalıştırma izni ver
        run: chmod +x android/gradlew

      # secrets bağlamı adım if'inde kullanılamaz, o yüzden kontrol script içinde
      - name: İmza anahtarını hazırla
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret'ı tanımlı değil — APK imzasız derlenecek ve telefonlara kurulamaz."
          fi

      - name: Sürüm APK'sını derle
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: APK'yı anlamlı bir adla kopyala
        run: |
          mkdir -p dist
          # imzalıysa app-release.apk, imzasızsa app-release-unsigned.apk üretilir
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$apk" || { echo "APK bulunamadı"; exit 1; }
          cp "$apk" "dist/yemek-asistani-${GITHUB_REF_NAME}.apk"

      # Etiketle tetiklendiyse: Release oluştur ve APK'yı ekle
      - name: Release oluştur ve APK'yı yükle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      # Elle tetiklendiyse: APK'yı Actions çıktısı olarak bırak
      - name: APK'yı iş çıktısı olarak sakla
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: yemek-asistani-apk
          path: dist/*.apk
